services:
  homecenter:
    image: ghcr.io/yatzin/homecenter:latest
    ports:
      - "3000:3000"
    volumes:
      # Persists the SQLite database + uploaded files outside the container.
      - /volume1/docker/homecenter:/data
      # Optional: a second disk or NAS share for backups (Settings → Data → Folder: /backups).
      # - /volume2/backups/homecenter:/backups
    environment:
      # Where the SQLite file lives inside the container. Leave as-is.
      DATABASE_URL: "file:/data/homecenter.db"

      # Encrypts/signs login sessions. Generate your own — don't reuse this
      # value: `openssl rand -base64 32`. Changing it later logs everyone out.
      AUTH_SECRET: "q8fJZ3n0X9pQe2vT7yB1kR4mL6cW8dS0uA5hN3zP9io="

      # The exact URL you'll browse to (e.g. http://192.168.1.50:3000).
      # Optional: the app auto-detects the host from each request if left
      # blank, so it's fine not to know this until after you've deployed.
      AUTH_URL: ""

      # Max size (bytes) for a single upload. 26214400 = 25 MiB.
      MAX_UPLOAD_BYTES: "26214400"

      # Admin account created the FIRST time the database is seeded (empty
      # DB). Changing these later does nothing to an admin that already
      # exists — change your password from inside the app instead.
      ADMIN_NAME: "Admin"
      ADMIN_EMAIL: "your@email.com"
      ADMIN_PASSWORD: "changeme"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
